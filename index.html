<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="मण्डली कार्यक्रम">
<meta name="theme-color" content="#1F2A24">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root {
    --text-scale: 1;
    /* Light theme (default) */
    --bg: #EEF0EA;
    --surface: #FFFFFF;
    --ink: #232A24;
    --ink-strong: #1F2A24;
    --ink-on-strong: #F3F1E8;
    --ink-muted: #5C6B5F;
    --ink-faint: #8A8F82;
    --ink-faintest: #A6AB9C;
    --ink-eyebrow: #6B7A6D;
    --agenda-text: #3A423B;
    --border: #DDE1D6;
    --border-soft: #E4E1D3;
    --border-strong: #CDD3C4;
    --card-border: #ECEEE7;
    --chip-bg: #EEF0EA;
    --chip-bg2: #F3F1E8;
    --chip-bg3: #F7F8F4;
    --accent-gold: #C98A2B;
    --accent-gold-text: #FFFFFF;
    --danger-bg: #FBE9E7;
    --danger-text: #8B3A2B;
    --sync-bg: #E9F0EA;
    --sync-text: #2F5D50;
    --scrollbar: #C9CFC0;
    --cat-blue: #3E6598;
    --cat-blue-tint: #EAF0F8;
    --cat-plum: #7C4B6E;
    --cat-plum-tint: #F4EDF2;
    --cat-olive: #8B6F1F;
    --cat-olive-tint: #F6F1E2;
    --shadow-1: rgba(31,42,36,.06);
    --shadow-2: rgba(31,42,36,.04);
    --modal-backdrop: rgba(31,42,36,.45);
  }
  [data-theme="dark"] {
    --bg: #171C18;
    --surface: #232A24;
    --ink: #E7E9E2;
    --ink-strong: #EDE9DD;
    --ink-on-strong: #1F2A24;
    --ink-muted: #A9B0A2;
    --ink-faint: #848B7E;
    --ink-faintest: #6C7266;
    --ink-eyebrow: #7C8377;
    --agenda-text: #D3D6CC;
    --border: #333B34;
    --border-soft: #2E352F;
    --border-strong: #3D453E;
    --card-border: #2B322C;
    --chip-bg: #2B322C;
    --chip-bg2: #2B322C;
    --chip-bg3: #1D231E;
    --accent-gold: #E0A542;
    --accent-gold-text: #1F2A24;
    --danger-bg: #3A2420;
    --danger-text: #F2A99B;
    --sync-bg: #1B2A22;
    --sync-text: #8FCBAE;
    --scrollbar: #3D453E;
    --cat-blue: #7FA8D6;
    --cat-blue-tint: #1C2733;
    --cat-plum: #D79FC4;
    --cat-plum-tint: #2B1F27;
    --cat-olive: #D9B655;
    --cat-olive-tint: #2E2814;
    --shadow-1: rgba(0,0,0,.3);
    --shadow-2: rgba(0,0,0,.24);
    --modal-backdrop: rgba(0,0,0,.6);
  }
  body, .card, .feed-card, .modal, .text-size-toggle, .theme-toggle { transition: background-color .2s ease, color .2s ease, border-color .2s ease; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Noto Sans Devanagari','Noto Sans JP','Noto Sans',sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

  .header {
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap;
    gap: 12px; max-width: 1100px; margin: 0 auto 18px; border-bottom: 1px solid var(--border); padding-bottom: 16px;
  }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: calc(11px * var(--text-scale)); letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-eyebrow); margin-bottom: 6px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: calc(34px * var(--text-scale)); margin: 0; color: var(--ink-strong); }
  .header-sub { font-size: calc(13px * var(--text-scale)); color: var(--ink-muted); margin-top: 6px; }
  .today-badge { background: var(--ink-strong); color: var(--ink-on-strong); border-radius: 10px; padding: 10px 16px; min-width: 180px; }
  .theme-toggle { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); border-radius: 999px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .text-size-toggle { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px; }
  .text-size-btn { border: none; background: transparent; color: var(--ink); border-radius: 999px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 700; -webkit-appearance: none; appearance: none; }
  .text-size-btn:first-child { font-size: 15px; }
  .text-size-btn:last-child { font-size: 20px; }
  .text-size-btn:disabled { opacity: .3; }
  .text-size-pct { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-muted); min-width: 38px; text-align: center; }
  .today-label { font-family: 'IBM Plex Mono', monospace; font-size: calc(10px * var(--text-scale)); letter-spacing: 1px; opacity: .7; }
  .today-date { font-size: calc(14px * var(--text-scale)); font-weight: 600; margin-top: 2px; }

  .next-banner { max-width: 1100px; margin: 0 auto 14px; background: var(--ink-strong); color: var(--ink-on-strong); border-radius: 14px; padding: 16px 18px; }
  .next-banner-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--text-scale)); letter-spacing: .8px; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
  .next-banner-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: calc(19px * var(--text-scale)); margin-bottom: 4px; }
  .next-banner-meta { font-size: calc(13px * var(--text-scale)); opacity: .9; }
  .next-banner-foot { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .next-banner .ics-btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.22); color: var(--ink-on-strong); }
  .next-banner-cta { max-width: 1100px; margin: 0 auto 14px; background: var(--chip-bg2); border: 1px dashed var(--border-strong); border-radius: 12px; padding: 12px 16px; font-size: calc(13px * var(--text-scale)); color: var(--ink-muted); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sync-bar { max-width: 1100px; margin: 0 auto 12px; background: var(--sync-bg); color: var(--sync-text); border-radius: 8px; padding: 8px 14px; font-size: calc(12.5px * var(--text-scale)); }
  .err-bar { max-width: 1100px; margin: 0 auto 12px; background: var(--danger-bg); color: var(--danger-text); border-radius: 8px; padding: 8px 14px; font-size: calc(12.5px * var(--text-scale)); }

  .tabs { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto 12px; flex-wrap: wrap; }
  .tab-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 14px; text-align: left; color: var(--ink); line-height: 1.3; min-height: 44px; -webkit-appearance: none; appearance: none; }
  .tab-btn.active { background: var(--ink-strong); color: var(--ink-on-strong); border-color: var(--ink-strong); }
  .tab-btn-sub { font-family: 'IBM Plex Mono', monospace; font-size: calc(10px * var(--text-scale)); opacity: .65; }

  .month-tabs { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto 16px; flex-wrap: wrap; }
  .month-btn { border: 1px solid var(--border-strong); background: transparent; border-radius: 999px; padding: 10px 16px; font-size: calc(12px * var(--text-scale)); font-family: 'IBM Plex Mono', monospace; color: var(--ink-muted); min-height: 40px; -webkit-appearance: none; appearance: none; }
  .month-btn.active { background: var(--accent-gold); color: var(--accent-gold-text); border-color: var(--accent-gold); }

  .search-input { width: 100%; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); font-size: calc(15px * var(--text-scale)); font-family: inherit; outline: none; -webkit-appearance: none; appearance: none; }
  .primary-btn { border: none; background: var(--ink-strong); color: var(--ink-on-strong); border-radius: 10px; padding: 13px 20px; font-size: calc(14px * var(--text-scale)); font-weight: 600; min-height: 48px; white-space: nowrap; }
  .link-btn { border: none; background: none; color: var(--cat-blue); text-decoration: underline; font-size: calc(13px * var(--text-scale)); padding: 6px 4px; }

  .my-name-setup { max-width: 480px; margin: 6vh auto 0; text-align: center; padding: 0 8px; }
  .my-name-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: calc(22px * var(--text-scale)); margin-bottom: 8px; }
  .my-name-hint { font-size: calc(13.5px * var(--text-scale)); color: var(--ink-muted); margin-bottom: 18px; line-height: 1.6; }
  .my-name-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .my-name-row .search-input { flex: 1; min-width: 200px; }

  .my-name-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 14px; font-size: calc(13.5px * var(--text-scale)); color: var(--ink-muted); }

  main { max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; align-items: start; }
  .empty-state { color: var(--ink-muted); font-size: calc(14px * var(--text-scale)); padding: 24px 4px; }

  .card { position: relative; background: var(--surface); border-radius: 12px; border-top: 3px solid; box-shadow: 0 1px 2px rgba(31,42,36,.06), 0 6px 16px rgba(31,42,36,.04); padding: 16px 16px 14px; border: 1px solid var(--card-border); border-top-width: 3px; }
  .card.clickable { cursor: pointer; }
  .pin { position: absolute; top: 10px; right: 12px; width: 8px; height: 8px; border-radius: 50%; }
  .card-header-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; padding-right: 14px; }
  .card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: calc(17px * var(--text-scale)); margin-bottom: 4px; padding-right: 14px; }
  .card-title-faint { font-style: italic; color: var(--ink-faintest); margin-bottom: 4px; font-size: calc(14px * var(--text-scale)); }
  .card-sub { font-size: calc(12px * var(--text-scale)); color: var(--ink-muted); margin-bottom: 8px; }
  .card-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .cat-label { font-size: calc(11px * var(--text-scale)); color: var(--ink-faint); margin-bottom: 4px; }
  .sub-faint { color: var(--ink-faintest); }

  .date-stamp { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: calc(12px * var(--text-scale)); background: var(--ink-strong); color: var(--ink-on-strong); border-radius: 6px; padding: 3px 8px; }
  .rel-badge { font-family: 'IBM Plex Mono', monospace; font-size: calc(10px * var(--text-scale)); background: var(--ink-strong); color: var(--ink-on-strong); border-radius: 6px; padding: 3px 8px; }
  .day-tag { font-size: calc(12px * var(--text-scale)); color: var(--ink-muted); }
  .time-tag { font-family: 'IBM Plex Mono', monospace; font-size: calc(11px * var(--text-scale)); background: var(--ink-on-strong); border: 1px solid var(--border-soft); border-radius: 6px; padding: 3px 7px; }
  .num-tag { font-family: 'IBM Plex Mono', monospace; font-size: calc(11px * var(--text-scale)); color: var(--ink-faint); }
  .person-tag { font-size: calc(12px * var(--text-scale)); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-weight: 500; display: inline-block; }
  .role-label { font-size: calc(11px * var(--text-scale)); color: var(--ink-faint); }
  .areas-text { font-size: calc(12px * var(--text-scale)); color: var(--ink-muted); white-space: pre-line; background: var(--chip-bg3); border-radius: 8px; padding: 8px 10px; margin-top: 6px; line-height: 1.5; }
  .area-link { color: var(--cat-blue); text-decoration: underline; text-decoration-color: var(--cat-blue); font-weight: 600; }
  .area-link:hover { text-decoration-color: var(--cat-blue); }
  .jp-text { font-size: calc(12px * var(--text-scale)); color: var(--ink-faint); margin-bottom: 4px; }
  .note-text { font-size: calc(12px * var(--text-scale)); color: var(--ink-faint); margin-top: 8px; font-style: italic; }
  .map-link { font-size: calc(12px * var(--text-scale)); color: var(--cat-blue); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 6px; }
  .ics-btn { font-size: calc(11.5px * var(--text-scale)); color: var(--ink-muted); background: var(--chip-bg2); border: 1px solid var(--border-soft); border-radius: 999px; padding: 6px 12px; margin-top: 8px; display: inline-block; }
  .ics-btn:active { background: var(--border-soft); }

  .role-grid { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
  .role-item { display: flex; flex-direction: column; gap: 3px; }

  .special-banner { background: var(--cat-olive-tint); color: var(--cat-olive); border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: calc(14px * var(--text-scale)); }
  .expand-hint { font-family: 'IBM Plex Mono', monospace; font-size: calc(11px * var(--text-scale)); color: var(--cat-olive); margin-top: 4px; }
  .agenda { margin-top: 12px; border-top: 1px dashed var(--border-soft); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .agenda-row, .agenda-section { display: flex; align-items: baseline; gap: 8px; font-size: calc(12.5px * var(--text-scale)); }
  .agenda-section { margin-top: 8px; }
  .agenda-time { font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--text-scale)); color: var(--ink-faintest); min-width: 40px; }
  .agenda-text { flex: 1; color: var(--agenda-text); }
  .agenda-section-text { flex: 1; color: var(--cat-olive); font-weight: 700; }
  .agenda-assignee { font-size: calc(11px * var(--text-scale)); color: var(--ink-muted); font-weight: 600; white-space: nowrap; }

  .cat-chip { font-size: calc(11px * var(--text-scale)); font-weight: 600; border-radius: 999px; padding: 3px 10px; display: inline-block; margin-bottom: 8px; }

  /* Life & Ministry — text sized 20% larger than other sections
     for easier reading, per request. */
  .lm-card .date-stamp { font-size: calc(14.4px * var(--text-scale)); }
  .lm-card .role-label { font-size: calc(13.2px * var(--text-scale)); }
  .lm-card .person-tag { font-size: calc(14.4px * var(--text-scale)); }
  .lm-card .special-banner { font-size: calc(16.8px * var(--text-scale)); }
  .lm-card .expand-hint { font-size: calc(13.2px * var(--text-scale)); }
  .lm-card .agenda-row, .lm-card .agenda-section { font-size: calc(15px * var(--text-scale)); }
  .lm-card .agenda-time { font-size: calc(12.6px * var(--text-scale)); }
  .lm-card .agenda-assignee { font-size: calc(13.2px * var(--text-scale)); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(31,42,36,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; position: relative; max-height: 80vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 14px; right: 14px; border: none; background: var(--ink-on-strong); border-radius: 50%; width: 36px; height: 36px; font-size: calc(15px * var(--text-scale)); -webkit-appearance: none; appearance: none; }
  .modal-date { font-size: calc(12px * var(--text-scale)); color: var(--ink-faint); margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
  .modal-title { font-family: 'Fraunces', serif; font-size: calc(22px * var(--text-scale)); margin: 0 0 8px; }
  .modal-sub { font-size: calc(13px * var(--text-scale)); color: var(--ink-muted); margin-bottom: 10px; }
  .hidden { display: none !important; }

  /* Sign-in gate */
  #signinScreen { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 16px; }
  #signinScreen h1 { font-size: calc(26px * var(--text-scale)); margin-bottom: 6px; }
  #signinScreen p { font-size: calc(13.5px * var(--text-scale)); color: var(--ink-muted); margin-bottom: 22px; line-height: 1.6; }
  #signinBtnHolder { display: flex; justify-content: center; }
  #signinError { margin-top: 18px; font-size: calc(13px * var(--text-scale)); color: var(--danger-text); background: var(--danger-bg); border-radius: 8px; padding: 10px 14px; display: none; }
  #signinLoading { font-size: calc(13px * var(--text-scale)); color: var(--ink-muted); margin-top: 14px; display: none; }
  #appRoot { display: none; }

  footer { max-width: 1100px; margin: 30px auto 0; text-align: center; font-size: calc(12px * var(--text-scale)); color: var(--ink-faintest); padding-bottom: 8px; }

  @media (max-width: 480px) {
    body { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .header { flex-direction: column; align-items: flex-start; }
    h1 { font-size: calc(26px * var(--text-scale)); }
    .today-badge { width: 100%; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 0 0 auto; }
    .month-tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .month-tabs::-webkit-scrollbar { display: none; }
    .month-btn { flex: 0 0 auto; }
    .grid { grid-template-columns: 1fr; }
    .modal { max-height: 85vh; padding: 20px; }
  }

  /* iPad / laptop / desktop — scale everything up a notch.
     700px comfortably covers iPad portrait (~744px+) through
     desktop, while phone widths (even landscape, ~430-480px)
     stay below it. Phone styles above are untouched. */
  @media (min-width: 700px) {
    body { font-size: calc(17px * var(--text-scale)); }
    .header, .sync-bar, .err-bar, .tabs, .month-tabs, main, footer { max-width: 1320px; }
    h1 { font-size: calc(42px * var(--text-scale)); }
    .eyebrow { font-size: calc(13px * var(--text-scale)); }
    .header-sub { font-size: calc(15px * var(--text-scale)); }
    .today-badge { padding: 14px 20px; min-width: 220px; }
    .today-label { font-size: calc(11px * var(--text-scale)); }
    .today-date { font-size: calc(16px * var(--text-scale)); }
    .sync-bar, .err-bar { font-size: calc(14px * var(--text-scale)); padding: 10px 18px; }

    .tab-btn { padding: 12px 20px; font-size: calc(15px * var(--text-scale)); }
    .tab-btn-sub { font-size: calc(11.5px * var(--text-scale)); }
    .month-btn { padding: 11px 20px; font-size: calc(14px * var(--text-scale)); }

    .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
    .card { padding: 20px 20px 18px; border-radius: 14px; }
    .card-title { font-size: calc(20px * var(--text-scale)); }
    .card-title-faint { font-size: calc(16px * var(--text-scale)); }
    .card-sub { font-size: calc(14px * var(--text-scale)); }
    .cat-label { font-size: calc(12.5px * var(--text-scale)); }
    .empty-state { font-size: calc(16px * var(--text-scale)); }

    .date-stamp { font-size: calc(13.5px * var(--text-scale)); padding: 4px 10px; }
    .rel-badge { font-size: calc(11.5px * var(--text-scale)); padding: 4px 10px; }
    .day-tag { font-size: calc(13.5px * var(--text-scale)); }
    .time-tag { font-size: calc(12.5px * var(--text-scale)); padding: 4px 9px; }
    .num-tag { font-size: calc(12.5px * var(--text-scale)); }
    .person-tag { font-size: calc(13.5px * var(--text-scale)); padding: 4px 12px; }
    .role-label { font-size: calc(12.5px * var(--text-scale)); }
    .areas-text { font-size: calc(14px * var(--text-scale)); padding: 10px 12px; }
    .jp-text { font-size: calc(13.5px * var(--text-scale)); }
    .note-text { font-size: calc(13.5px * var(--text-scale)); }
    .map-link { font-size: calc(13.5px * var(--text-scale)); }

    .special-banner { font-size: calc(15.5px * var(--text-scale)); padding: 12px 14px; }
    .expand-hint { font-size: calc(12.5px * var(--text-scale)); }
    .agenda-row, .agenda-section { font-size: calc(14px * var(--text-scale)); }
    .agenda-time { font-size: calc(12px * var(--text-scale)); min-width: 46px; }
    .agenda-assignee { font-size: calc(12.5px * var(--text-scale)); }

    .cat-chip { font-size: calc(12.5px * var(--text-scale)); padding: 4px 12px; }

<script>
/* ============================================================

// The /exec URL from your Apps Script deployment.
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6QId6O9vHWMcA-sq7R0chuF0ed3P3i8-srmeukWMUSH3uNWFApg3wtQzUmucf8SOrTw/exec";

var GOOGLE_CLIENT_ID = "752070145895-49kenu29mj4jfei3di41nahpvkv69ded.apps.googleusercontent.com";

var DATA = null;

var CATS = {

};
var NEPALI_MONTHS_EN = { "01":"January","02":"February","03":"March","04":"April","05":"May","06":"June","07":"July","08":"August","09":"September","10":"October","11":"November","12":"December" };
var SECTION_HEADERS = { "बाइबलमा पाइने अनमोल धन":1, "कुराकानी गर्ने सीप तिखारौँ":1, "ख्रीष्टियन जीवन":1 };

function monthLabel(ymKey) {
  var parts = ymKey.split("-");
  return (NEPALI_MONTHS_EN[parts[1]] || parts[1]) + " " + parts[0];
}
function todayIso() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function toDateObj(iso) { return new Date(iso + "T00:00:00"); }
function fmtShort(iso) { return toDateObj(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function fmtFull(iso) { return toDateObj(iso).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
function dayDelta(iso, todayStr) { return Math.round((toDateObj(iso) - toDateObj(todayStr)) / 86400000); }
function relLabel(iso, todayStr) {
  var n = dayDelta(iso, todayStr);
  if (n === 0) return "आज · Today";
  if (n === 1) return "भोलि · Tomorrow";
  if (n > 1 && n < 7) return n + " दिनमा · in " + n + " days";
  return null;
}
function isoOf(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
var MY_NAME_KEY = "programDashboardMyName";
function getMyName() {
  try { return localStorage.getItem(MY_NAME_KEY); } catch (_) { return null; }
}
function setMyName(name) {
  try { localStorage.setItem(MY_NAME_KEY, name); } catch (_) {}
}
function clearMyName() {
  try { localStorage.removeItem(MY_NAME_KEY); } catch (_) {}
}
function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ============================================================
   ADD TO CALENDAR — builds a .ics file for a single event and
   hands it to the phone's calendar app. Works with either a
   specific time (field service, Life & Ministry) or falls back
   to an all-day event when no time is known (public talks).
   ============================================================ */
var CAT_DURATION_MIN = { fieldService: 120, lifeMinistry: 105, publicTalks: 90 };
var icsLookup = {};

// Accepts either "AM10:00"/"PM5:30" (field service) or already
// 24-hour "HH:MM" (Life & Ministry) and returns 24-hour "HH:MM".
function normalizeTimeTo24h(raw) {
  if (!raw) return null;
  raw = String(raw).trim();
  var ampm = raw.match(/^([AP])M\s*(\d{1,2}):(\d{2})$/i);
  if (ampm) {
    var isPM = ampm[1].toUpperCase() === "P";
    var h = parseInt(ampm[2], 10) % 12;
    if (isPM) h += 12;
    return String(h).padStart(2, "0") + ":" + ampm[3];
  }
  var h24 = raw.match(/^(\d{1,2}):(\d{2})$/);
  if (h24) return String(parseInt(h24[1], 10)).padStart(2, "0") + ":" + h24[2];
  return null;
}

function icsEscape(str) {
  return String(str || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

// ev: { iso, time (optional "HH:MM" 24h, null = all-day), durationMin, title, location, description }
function buildIcs(ev) {
  var uid = "programdashboard-" + ev.iso + "-" + Math.random().toString(36).slice(2) + "@congregation";
  var now = new Date();
  var dtstamp = now.getUTCFullYear() + String(now.getUTCMonth()+1).padStart(2,"0") + String(now.getUTCDate()).padStart(2,"0") +
    "T" + String(now.getUTCHours()).padStart(2,"0") + String(now.getUTCMinutes()).padStart(2,"0") + String(now.getUTCSeconds()).padStart(2,"0") + "Z";
  var isoCompact = ev.iso.replace(/-/g, "");
  var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Program Dashboard//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+dtstamp];

  if (ev.time) {
    var parts = ev.time.split(":");
    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    var dur = ev.durationMin || 60;
    var endMin = h * 60 + m + dur;
    var eh = Math.floor(endMin / 60) % 24, em = endMin % 60;
    lines.push("DTSTART:" + isoCompact + "T" + String(h).padStart(2,"0") + String(m).padStart(2,"0") + "00");
    lines.push("DTEND:" + isoCompact + "T" + String(eh).padStart(2,"0") + String(em).padStart(2,"0") + "00");
  } else {
    var d = toDateObj(ev.iso);
    var next = new Date(d); next.setDate(d.getDate() + 1);
    lines.push("DTSTART;VALUE=DATE:" + isoCompact);
    lines.push("DTEND;VALUE=DATE:" + isoOf(next).replace(/-/g, ""));
  }

  lines.push("SUMMARY:" + icsEscape(ev.title));
  if (ev.location) lines.push("LOCATION:" + icsEscape(ev.location));
  if (ev.description) lines.push("DESCRIPTION:" + icsEscape(ev.description));
  lines.push("END:VEVENT", "END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadIcs(ev) {
  var ics = buildIcs(ev);
  var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  // Deliberately no "download" attribute: on iOS/iPadOS Safari, a plain
  // navigation to a text/calendar blob opens the native "Add to
  // Calendar" sheet directly. Adding "download" instead forces a file
  // save on some browsers, which skips that native prompt.
  var a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
}

function icsButtonHtml(key) {

// Renders the ics button AND registers its event descriptor in
// icsLookup under the given key, so the click handler can find it.
function registerIcs(key, ev) {

}

// Renders the इलाका (areas) cell, preserving per-line hyperlinks if the
// spreadsheet has any (e.g. "Okubo①-1" linking to a map). Falls back to
// plain text when there are no links.
function areasHtml(entryLike) {
  if (entryLike.areasLinks && entryLike.areasLinks.length) {
    return entryLike.areasLinks.map(function(seg, i) {
      var t = esc(seg.text);
      var line = seg.url ? '<a class="area-link" href="'+esc(seg.url)+'" target="_blank" rel="noreferrer">'+t+'</a>' : t;
      return i < entryLike.areasLinks.length - 1 ? line + "\n" : line;
    }).join("");
  }
  return esc(entryLike.areas || "");
}

function buildFeed() {

      if (!e.iso) return;

    });
  });
  (DATA.publicTalks || []).forEach(function(t, i) {
    if (!t.iso) return;
    feed.push({ cat:"publicTalks", iso:t.iso, key:"pt-"+i, title:t.topicNp || (t.otherNote || "जनभाषण"), subtitle:t.topicJp, time:null, people:[t.speaker].filter(Boolean), raw:t });
  });
  Object.keys(DATA.lifeMinistry || {}).forEach(function(month) {
    (DATA.lifeMinistry[month] || []).forEach(function(w, i) {
      if (!w.iso) return;
      feed.push({ cat:"lifeMinistry", iso:w.iso, key:"lm-"+month+"-"+i, title:w.special || "हाम्रो ख्रिष्टियन जीवन र सेवा सभा", subtitle: w.chairman ? ("अध्यक्ष: "+w.chairman) : null, time: (w.items && w.items[0]) ? w.items[0].time : null, people:[w.chairman].filter(Boolean), raw:w });
    });
  });
  feed.sort(function(a,b){ return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0; });
  return feed;
}

      if (pair[0]) rows.push({ cat:"publicTalks", iso:t.iso, time:null, name:pair[0], role:pair[1], context:t.topicNp || t.date });

  Object.keys(DATA.lifeMinistry || {}).forEach(function(m) {

function fieldServiceCardHtml(e, key, expanded) {

  return '' +
    '<div class="card lm-card clickable" style="border-top-color:'+c.color+'" data-toggle-week="'+weekKey+'">' +
      pinHtml(c.color) +
      '<div class="card-header-row">' +
        '<span class="date-stamp">'+esc(w.dateRaw)+' '+esc(w.monthLabel)+'</span>' +
        (w.chairman ? '<span class="role-label">अध्यक्ष</span><span class="person-tag">'+esc(w.chairman)+'</span>' : '') +
      '</div>' +
      '<div class="expand-hint">'+(expanded ? "कार्यक्रम लुकाउनुहोस् ▲" : ("पूरा कार्यक्रम हेर्नुहोस् ("+w.items.length+" भाग) ▾"))+'</div>' +
      agendaHtml +
    '</div>';
}

function searchResultCardHtml(r, i) {
  var c = CATS[r.cat];
  var icsBtn = '';
  if (r.iso) {
    icsBtn = registerIcs("sr-" + i + "-" + r.iso, {

}

/* ---------- Text size toggle ---------- */
var TEXT_SCALE_MIN = 0.8;
var TEXT_SCALE_MAX = 1.6;
var TEXT_SCALE_STEP = 0.1;
var TEXT_SCALE_KEY = "programDashboardTextScale";

function applyTextScale(scale) {
  scale = Math.min(TEXT_SCALE_MAX, Math.max(TEXT_SCALE_MIN, scale));
  document.documentElement.style.setProperty("--text-scale", scale);
  var pctEl = document.getElementById("textSizePct");
  if (pctEl) pctEl.textContent = Math.round(scale * 100) + "%";
  var downBtn = document.getElementById("textSizeDown");
  var upBtn = document.getElementById("textSizeUp");
  if (downBtn) downBtn.disabled = scale <= TEXT_SCALE_MIN;
  if (upBtn) upBtn.disabled = scale >= TEXT_SCALE_MAX;
  try { localStorage.setItem(TEXT_SCALE_KEY, String(scale)); } catch (_) {}
  return scale;
}

function loadTextScale() {
  var saved = 1;
  try {
    var v = parseFloat(localStorage.getItem(TEXT_SCALE_KEY));
    if (!isNaN(v)) saved = v;
  } catch (_) {}
  return applyTextScale(saved);
}

var currentTextScale = loadTextScale(); // applied immediately, even before sign-in

document.getElementById("textSizeDown").addEventListener("click", function() {
  currentTextScale = applyTextScale(Math.round((currentTextScale - TEXT_SCALE_STEP) * 10) / 10);
});
document.getElementById("textSizeUp").addEventListener("click", function() {
  currentTextScale = applyTextScale(Math.round((currentTextScale + TEXT_SCALE_STEP) * 10) / 10);
});

/* ---------- Dark mode toggle ---------- */
var THEME_KEY = "programDashboardTheme";

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  var btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
  try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
  return theme;
}

function loadTheme() {
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
  if (saved !== "dark" && saved !== "light") {
    // No saved preference yet — default to the device's own dark/light setting.
    saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  return applyTheme(saved);
}

var currentTheme = loadTheme(); // applied immediately, even before sign-in

document.getElementById("themeToggle").addEventListener("click", function() {
  currentTheme = applyTheme(currentTheme === "dark" ? "light" : "dark");
});

/* ---------- Render ---------- */
var todayStr = todayIso();
var feedCache = null, searchIdxCache = null, openItemLookup = {};

function getNextAssignment() {
  var myName = getMyName();
  if (!myName) return null;
  if (!searchIdxCache) searchIdxCache = buildSearchIndex();
  var q = myName.trim().toLowerCase();
  var mine = searchIdxCache.filter(function(r) { return r.iso && r.iso >= todayStr && r.name.toLowerCase().indexOf(q) !== -1; });
  mine.sort(function(a, b) { return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0; });
  return mine[0] || null;
}

function renderNextAssignmentBanner() {

    el.innerHTML =
      '<div class="next-banner-cta">' +

      '</div>';
    return;
  }

  var next = getNextAssignment();
  if (!next) { el.innerHTML = ""; return; }

  var rel = relLabel(next.iso, todayStr);
  var icsEv = {
    iso: next.iso,

    durationMin: CAT_DURATION_MIN[next.cat],

      '<div class="next-banner-title">' + esc(next.context || next.role) + '</div>' +

function render() {
  document.getElementById("todayDate").textContent = fmtFull(todayStr);

  var syncBar = document.getElementById("syncBar");
  var genAt = DATA.meta && DATA.meta.generatedAt ? new Date(DATA.meta.generatedAt).toLocaleString() : null;
  syncBar.textContent = genAt ? ("✓ लाइभ डेटा · जेनेरेट गरिएको: " + genAt) : "✓ लाइभ डेटा";

  var errBar = document.getElementById("errBar");
  if (DATA.errors && DATA.errors.length) {
    errBar.textContent = "⚠ केही डेटा लोड हुन सकेन: " + DATA.errors.join(" | ");
    errBar.classList.remove("hidden");
  } else {
    errBar.classList.add("hidden");
  }

  renderNextAssignmentBanner();
  renderTabs();
  renderMonthTabs();
  renderMain();
}

function renderTabs() {
  var tabsEl = document.getElementById("tabs");
  if (state.tab === "search") { tabsEl.classList.add("hidden"); return; }
  tabsEl.classList.remove("hidden");
  var defs = [
    ["upcoming","आगामी","Upcoming"],
    ["myProgram","मेरो कार्यक्रम","My Assignments"],
    ["fieldService",CATS.fieldService.label,CATS.fieldService.sub],
    ["lifeMinistry",CATS.lifeMinistry.label,CATS.lifeMinistry.sub],
    ["publicTalks",CATS.publicTalks.label,CATS.publicTalks.sub],
  ];
  tabsEl.innerHTML = defs.map(function(d) {
    var active = state.tab === d[0];
    return '<button class="tab-btn'+(active?" active":"")+'" data-tab="'+d[0]+'"><div>'+esc(d[1])+'</div><div class="tab-btn-sub">'+esc(d[2])+'</div></button>';
  }).join("");
}

function renderMonthTabs() {
  var el = document.getElementById("monthTabs");
  var months = null;
  if (state.tab === "fieldService") months = Object.keys(DATA.fieldService || {}).sort();
  if (state.tab === "lifeMinistry") months = Object.keys(DATA.lifeMinistry || {}).sort();
  if (!months || !months.length) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  if (!state.month || months.indexOf(state.month) === -1) state.month = months[0];
  el.classList.remove("hidden");
  el.innerHTML = months.map(function(m) {
    var active = state.month === m;
    return '<button class="month-btn'+(active?" active":"")+'" data-month="'+m+'">'+esc(monthLabel(m))+'</button>';
  }).join("");
}

function renderMain() {
  var main = document.getElementById("main");

  if (state.tab === "search") {
    if (!searchIdxCache) searchIdxCache = buildSearchIndex();
    var q = state.query.trim().toLowerCase();
    var results = searchIdxCache.filter(function(r){ return r.name.toLowerCase().indexOf(q) !== -1; });
    results.sort(function(a,b){ return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0; });
    main.innerHTML = '<div class="grid">' +
      (results.length === 0 ? '<div class="empty-state">"'+esc(state.query)+'" सँग मिल्ने कुनै जिम्मेवारी भेटिएन।</div>' : '') +
      results.map(searchResultCardHtml).join("") +
    '</div>';
    return;
  }

  if (state.tab === "myProgram") {
    var myName = getMyName();
    if (!myName) {
      main.innerHTML =
        '<div class="my-name-setup">' +
          '<div class="my-name-title">तपाईंको नाम राख्नुहोस्</div>' +
          '<div class="my-name-hint">एकपटक राखेपछि, तपाईं संचालक/वक्ता/चेयरम्यान/असाइनमेन्ट भएका सबै कार्यक्रम यहाँ देख्नुहुनेछ।</div>' +
          '<div class="my-name-row">' +
            '<input class="search-input" id="myNameInput" placeholder="जस्तै: मासाया यामानासी">' +
            '<button class="primary-btn" id="myNameSaveBtn">सेभ गर्नुहोस्</button>' +
          '</div>' +
        '</div>';
      var saveBtn = document.getElementById("myNameSaveBtn");
      var input = document.getElementById("myNameInput");
      if (saveBtn) saveBtn.addEventListener("click", function() {
        if (input.value.trim()) { setMyName(input.value.trim()); render(); }
      });
      if (input) input.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && input.value.trim()) { setMyName(input.value.trim()); render(); }
      });
      return;
    }
    if (!searchIdxCache) searchIdxCache = buildSearchIndex();
    var q = myName.trim().toLowerCase();
    var mine = searchIdxCache.filter(function(r){ return r.name.toLowerCase().indexOf(q) !== -1; });
    mine.sort(function(a,b){ return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0; });
    main.innerHTML =
      '<div class="my-name-bar">' +
        '<span>तपाईं: <strong>'+esc(myName)+'</strong></span>' +
        '<button class="link-btn" id="myNameChangeBtn">बदल्नुहोस्</button>' +
      '</div>' +
      '<div class="grid">' +
      (mine.length === 0 ? '<div class="empty-state">"'+esc(myName)+'" सँग मिल्ने कुनै जिम्मेवारी भेटिएन।</div>' : '') +
      mine.map(searchResultCardHtml).join("") +
      '</div>';
    var changeBtn = document.getElementById("myNameChangeBtn");
    if (changeBtn) changeBtn.addEventListener("click", function() { clearMyName(); render(); });
    return;
  }

  if (state.tab === "upcoming") {
    if (!feedCache) feedCache = buildFeed();
    var upcoming = feedCache.filter(function(f){ return f.iso >= todayStr; }).slice(0, 10);
    openItemLookup = {}; upcoming.forEach(function(it){ openItemLookup[it.key] = it; });

      (upcoming.length === 0 ? '<div class="empty-state">कुनै आगामी कार्यक्रम भेटिएन।</div>' : '') +
      upcoming.map(function(it){ return feedCardHtml(it, todayStr); }).join("") +

    var fsEntries = (DATA.fieldService || {})[state.month] || [];

      (fsEntries.length === 0 ? '<div class="empty-state">यो महिनाको लागि डेटा भेटिएन।</div>' : '') +
      fsEntries.map(function(e, i) {
        var key = state.month + "-" + i;
        return fieldServiceCardHtml(e, key, !!state.expandedFS[key]);
      }).join("") +
    '</div>';
    return;
  }

  if (state.tab === "publicTalks") {
    main.innerHTML = '<div class="grid">' + (DATA.publicTalks || []).map(publicTalkCardHtml).join("") + '</div>';
    return;
  }

  if (state.tab === "lifeMinistry") {
    var lmWeeks = (DATA.lifeMinistry || {})[state.month] || [];
    main.innerHTML = '<div class="grid">' +
      (lmWeeks.length === 0 ? '<div class="empty-state">यो महिनाको लागि डेटा भेटिएन।</div>' : '') +
      lmWeeks.map(function(w, i) {
        var key = state.month + "-" + i;
        return lifeMinistryWeekHtml(w, key, !!state.expandedWeeks[key]);
      }).join("") +

    return;

}

/* ---------- Event delegation ---------- */
document.addEventListener("click", function(e) {
  if (e.target.closest("a")) return; // let map/area links navigate normally

  var icsBtn = e.target.closest("[data-add-ics]");
  if (icsBtn) {
    var icsKey = icsBtn.getAttribute("data-add-ics");
    if (icsLookup[icsKey]) downloadIcs(icsLookup[icsKey]);
    return;
  }

  var tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { state.tab = tabBtn.getAttribute("data-tab"); render(); return; }

  var monthBtn = e.target.closest("[data-month]");
  if (monthBtn) { state.month = monthBtn.getAttribute("data-month"); renderMonthTabs(); renderMain(); return; }

  var openBtn = e.target.closest("[data-open-item]");
  if (openBtn) {
    var key = openBtn.getAttribute("data-open-item");
    if (openItemLookup[key]) openModal(openItemLookup[key]);
    return;
  }

  var toggleBtn = e.target.closest("[data-toggle-week]");
  if (toggleBtn) {
    var wkey = toggleBtn.getAttribute("data-toggle-week");
    state.expandedWeeks[wkey] = !state.expandedWeeks[wkey];
    renderMain();
    return;
  }

  var toggleFsBtn = e.target.closest("[data-toggle-fs]");
  if (toggleFsBtn) {
    var fsKey = toggleFsBtn.getAttribute("data-toggle-fs");
    state.expandedFS[fsKey] = !state.expandedFS[fsKey];
    renderMain();
    return;
  }

  if (e.target.id === "modalCloseBtn" || e.target.id === "modalBackdrop") closeModal();
});

document.getElementById("copyrightYear").textContent = new Date().getFullYear();

/* ============================================================
   GOOGLE SIGN-IN GATE
   ============================================================ */
function showSigninError(msg) {
  var el = document.getElementById("signinError");
  el.textContent = msg;
  el.style.display = "block";
  document.getElementById("signinLoading").style.display = "none";
}

function handleCredentialResponse(response) {
  document.getElementById("signinError").style.display = "none";
  document.getElementById("signinLoading").style.display = "block";

  var idToken = response.credential;
  var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") === -1 ? "?" : "&") + "format=json&token=" + encodeURIComponent(idToken);

  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if (json && json.error === "access_denied") {
        showSigninError("प्रवेश निषेध गरिएको छ — यो खाता अनुमति सूचीमा समावेश छैन। Access denied — this account is not on the allowed list.");
        return;
      }
      if (json && json.error === "auth_required") {
        showSigninError("साइन इन असफल भयो, फेरि प्रयास गर्नुहोस्। Sign-in failed, please try again.");
        return;
      }
      DATA = json;
      lastIdToken = idToken;
      try { sessionStorage.setItem("programDashboardToken", idToken); } catch (_) {}
      document.getElementById("signinScreen").classList.add("hidden");
      document.getElementById("appRoot").style.display = "block";
      render();
      startAutoRefresh();
    })
    .catch(function(err) {
      showSigninError("डेटा लोड गर्न सकिएन। नेटवर्क जाँच्नुहोस्। (" + err.message + ")");
    });
}

/* ============================================================
   AUTO-REFRESH — quietly re-fetches data every 30 minutes so
   the dashboard stays current without needing a manual reload.
   Matches the backend's CACHE_SECONDS in Code.gs.

   IMPORTANT CAVEAT: setInterval alone is not reliable on
   phones — iOS Safari (and most mobile browsers) suspend
   JavaScript timers for tabs that aren't actively on screen
   (backgrounded app, locked phone, switched tabs). So on top
   of the interval, we also catch up whenever the page becomes
   visible again, which is what actually matters: the data is
   fresh by the time someone is actually looking at it.
   ============================================================ */
var lastIdToken = null;
var autoRefreshTimer = null;
var AUTO_REFRESH_MS = 30 * 60 * 1000;
var lastRefreshAt = 0;

function startAutoRefresh() {
  lastRefreshAt = Date.now();
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(silentRefresh, AUTO_REFRESH_MS);
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible" && Date.now() - lastRefreshAt >= AUTO_REFRESH_MS) {
      silentRefresh();
    }
  });
}

function silentRefresh() {
  if (!lastIdToken) return;
  var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") === -1 ? "?" : "&") + "format=json&token=" + encodeURIComponent(lastIdToken);
  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if (!json || json.error) {
        // Token has likely expired (Google ID tokens last ~1 hour).
        // Try to silently get a fresh one from Google — if the person
        // is still signed into their Google account in this browser,
        // this succeeds without any click and re-triggers
        // handleCredentialResponse with a new token automatically.
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.prompt();
        }
        return;
      }
      lastRefreshAt = Date.now();
      DATA = json;
      feedCache = null;
      searchIdxCache = null;
      render();
    })
    .catch(function() { /* network hiccup — try again on the next interval */ });
}

function initSignin() {
  if (!window.google || !google.accounts || !google.accounts.id) {
    setTimeout(initSignin, 200);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
  });
  google.accounts.id.renderButton(document.getElementById("signinBtnHolder"), {
    theme: "outline",
    size: "large",
    text: "signin_with",
    shape: "pill",
  });

  // If we have a token from earlier this session, try it silently
  // instead of making them click the button again.
  var savedToken;
  try { savedToken = sessionStorage.getItem("programDashboardToken"); } catch (_) {}
  if (savedToken) {
    handleCredentialResponse({ credential: savedToken });
  }
}

initSignin();
